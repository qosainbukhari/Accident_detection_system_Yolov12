version: "3.9"

services:

  # ── MySQL 8 ──────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: accident_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-accident_db}
      MYSQL_USER: ${MYSQL_USER:-accident_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - accident_net

  # ── FastAPI Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accident_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/ml_model:/app/ml_model          # mount model weights
      - media_data:/app/static                     # persistent processed media
      - upload_data:/app/data                      # uploads are kept outside the web root
    # Backend-only integration credentials are kept in backend/.env. Do not
    # replace them with empty values when the root Docker .env omits them.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-accident_app}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}@mysql:3306/${MYSQL_DATABASE:-accident_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,backend}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
    networks:
      - accident_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: accident_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - accident_net

volumes:
  mysql_data:
  media_data:
  upload_data:

networks:
  accident_net:
    driver: bridge
